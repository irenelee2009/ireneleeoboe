<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Irene Lee — Oboist</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { --sage:#7A9E87; --sage-light:#EAF1EC; --frame:#FAF8F2; }
html, body { height:100%; }
body { font-family:'Inter', sans-serif; background:var(--frame); color:#fff; overflow-x:hidden; padding:8px; }

#hero {
  position:relative;
  width:100%;
  height:calc(100vh - 16px);
  min-height:680px;
  overflow:hidden;
}

/* Background photo — natural brightness */
#hero::before {
  content:'';
  position:absolute;
  inset:0;
  background-image:url('orchestra-bg.jpg');
  background-size:auto 140%;
  background-position:center bottom;
  background-repeat:no-repeat;
  z-index:0;
}

/* Vignette + Irene spotlight + targeted darkening on girl in black */
#hero::after {
  content:'';
  position:absolute;
  inset:0;
  background:
    /* Subtle warm light on Irene */
    radial-gradient(ellipse 14% 18% at 47% 72%, rgba(255,240,200,0.25) 0%, transparent 70%),
    /* Targeted darkening on girl in black behind Irene */
    radial-gradient(ellipse 6% 7% at 41% 48%, rgba(0,0,0,0.78) 0%, transparent 95%),
    /* Targeted darkening on girl directly behind Irene (head visible above) */
    radial-gradient(ellipse 5% 6% at 44% 28%, rgba(0,0,0,0.65) 0%, transparent 95%),
    /* Vignette — clear at Irene's position, darker at edges */
    radial-gradient(ellipse 68% 68% at 47% 72%, transparent 22%, rgba(0,0,0,0.78) 100%),
    /* Subtle overall darkening of non-Irene area */
    radial-gradient(ellipse 25% 25% at 47% 72%, transparent 0%, transparent 50%, rgba(0,0,0,0.12) 100%),
    /* Text readability on left side */
    linear-gradient(to right, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,0) 65%, rgba(0,0,0,0.15) 100%);
  z-index:1;
}

.hero-content {
  position:relative;
  z-index:2;
  padding:55px 65px;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.hero-top { max-width:600px; }

.hero-logo {
  height: 80px;
  width: auto;
  margin-bottom: 12px;
  display: block;
  filter: drop-shadow(0 2px 20px rgba(0,0,0,0.5));
}

.hero-subtitle {
  font-family:'Inter', sans-serif;
  font-size:15px;
  color:rgba(255,255,255,0.85);
  letter-spacing:0.05em;
  font-weight:300;
  margin-bottom:24px;
  text-shadow:0 1px 8px rgba(0,0,0,0.6);
}

.hero-nav {
  display:flex;
  gap:28px;
  flex-wrap:wrap;
}

.hero-nav a {
  color:#fff;
  text-decoration:none;
  font-size:13px;
  letter-spacing:0.22em;
  font-weight:500;
  text-transform:uppercase;
  transition:opacity 0.2s;
  text-shadow:0 1px 8px rgba(0,0,0,0.6);
}

.hero-nav a:hover { opacity:0.65; }

.hero-tags {
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  font-size:10px;
  letter-spacing:0.12em;
  font-weight:500;
  color:rgba(255,255,255,0.9);
  text-shadow:0 1px 8px rgba(0,0,0,0.7);
  text-transform:uppercase;
}

.hero-tags span { white-space:nowrap; }
.hero-tags .dot { opacity:0.4; }

@media (max-width:768px) {
  body { padding:5px; }
  #hero { height:calc(100vh - 10px); min-height:600px; }
  .hero-content { padding:35px 25px; }
  .hero-logo { height: 56px; }
  .hero-subtitle { font-size:12px; margin-bottom:18px; }
  .hero-nav { gap:18px; }
  .hero-nav a { font-size:11px; letter-spacing:0.18em; }
  .hero-tags { gap:12px; font-size:9px; }
}
</style>
</head>
<body>
<div id="hero">
  <div class="hero-content">
      <div class="hero-top">
      <img src="logo-white.png" alt="Irene Lee" class="hero-logo">
      <div class="hero-subtitle">Oboe &amp; English Horn</div>
      <nav class="hero-nav">
        <a href="bio.html">Bio</a>
        <a href="awards.html">Highlights</a>
        <a href="video.html">Video</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
    <div class="hero-tags">
      <span>Juilliard Pre-College · Since 2021</span>
      <span class="dot">·</span>
      <span>YoungArts 2026 — Distinction</span>
      <span class="dot">·</span>
      <span>Verbier Festival · 2025, 2026</span>
      <span class="dot">·</span>
      <span>NYO2 · 2023, 2024</span>
    </div>
  </div>
</div>
</body>
</html>
